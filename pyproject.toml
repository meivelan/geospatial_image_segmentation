[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "galaxeye"
version = "1.0.0"
description = "GalaxEye satellite change detection library (EO + SAR fusion)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy",
    "rasterio",
    "albumentations",
    "segmentation-models-pytorch",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["galaxeye*"]